name: CI and delivery
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified image to the configured production server
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ecommerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci-password@localhost:5432/ecommerce_test?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - name: Check migration schema matches Prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run build
      - run: npm run lint:check
      - run: npm run typecheck
  docker:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image and database migrations
        env:
          APP_IMAGE: ${{ steps.image.outputs.name }}
        run: |
          cp .env.example .env
          JWT_SECRET=$(openssl rand -hex 32)
          export JWT_SECRET
          docker compose -p ci config --quiet
          docker compose -p ci up -d --no-build --wait --wait-timeout 180
          curl --fail --retry 5 --retry-delay 2 http://localhost:5001/api/health/db
          curl --fail http://localhost:5001/api/docs-json > /tmp/openapi.json
          node -e "const d=require('/tmp/openapi.json'); if (!d.paths['/api/checkout/orders'] || !d.paths['/api/webhooks/stripe']) process.exit(1)"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:5001/api/webhooks/stripe)
          test "$status" = 400
          docker compose -p ci exec -T app sh -c 'test "$(id -u)" != 0'
      - name: Container logs
        if: always()
        run: docker compose -p ci logs --no-color --tail=100
      - name: Clean up test containers
        if: always()
        run: docker compose -p ci down --volumes --remove-orphans
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          APP_IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "$APP_IMAGE"
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (vars.DEPLOY_ENABLED == 'true' || inputs.deploy == true)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      APP_IMAGE: ${{ needs.docker.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Transfer deployment files
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/scripts'"
          scp -P "$DEPLOY_PORT" docker-compose.production.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          scp -P "$DEPLOY_PORT" scripts/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/"
      - name: Authenticate server to image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
      - name: Deploy exact tested image
        run: ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && sh scripts/deploy.sh '$APP_IMAGE'"
      - name: Remove credentials
        if: always()
        run: |
          if [ -f ~/.ssh/id_ed25519 ]; then
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'docker logout ghcr.io' || true
          fi
          rm -f ~/.ssh/id_ed25519
